<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060917">
<title>Home | TNGPTC Exam Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#060917;--text:#f5f7ff;--muted:#98a3c7;--gold:#fbbf24;--gold2:#f59e0b;--line:rgba(251,191,36,.28);--glow:rgba(251,191,36,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45;overflow-x:hidden;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;pointer-events:none;will-change:transform}
body::before{width:460px;height:460px;top:-170px;right:-150px;background:radial-gradient(circle,rgba(251,191,36,.30),transparent 66%);animation:drift 15s ease-in-out infinite}
body::after{width:520px;height:520px;bottom:-200px;left:-170px;background:radial-gradient(circle,rgba(124,58,237,.40),transparent 66%);animation:drift 19s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-28px,24px,0) scale(1.18)}}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 12% 16%,rgba(255,255,255,.85),transparent),radial-gradient(1.5px 1.5px at 80% 10%,rgba(255,230,160,.95),transparent),radial-gradient(1px 1px at 46% 28%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 92% 46%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 20% 60%,rgba(255,230,160,.8),transparent),radial-gradient(1.5px 1.5px at 66% 80%,rgba(255,255,255,.7),transparent);animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.4}50%{opacity:1}}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(6,9,23,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 14px var(--glow)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--gold);box-shadow:0 0 16px var(--glow)}
.brand b{display:block;font-weight:800;letter-spacing:.03em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600}
#out{font:inherit;font-weight:700;color:#1a1204;background:linear-gradient(135deg,#fde68a,var(--gold2));border:0;border-radius:12px;padding:9px 18px;cursor:pointer;box-shadow:0 0 18px -2px var(--glow),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s}
#out:active{transform:scale(.94)}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:18px 16px 0}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ava{position:relative;width:68px;height:68px;flex:none;border-radius:50%}
.ava::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),#f472b6,#22d3ee,var(--gold));animation:spin 6s linear infinite;filter:drop-shadow(0 0 8px var(--glow))}
.ava>div{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#312e81,#1e1b4b);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--gold);overflow:hidden;border:3px solid var(--bg)}
.ava img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.hi{min-width:0}
.hi small{display:block;color:var(--muted);font-weight:600}
.hi h1{margin:0;font-size:26px;font-weight:800;line-height:1.15;background:linear-gradient(100deg,#fff 0%,var(--gold) 40%,#fff 60%,var(--gold) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite;word-break:break-word}
@keyframes shimmer{to{background-position:-220% 0}}
.role{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#1a1204;background:linear-gradient(135deg,#fde68a,var(--gold2));border-radius:99px;padding:3px 12px;box-shadow:0 0 14px -2px var(--glow)}
.strip{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(251,191,36,.14),rgba(124,58,237,.14));box-shadow:0 0 26px -10px var(--glow)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:#64748b}
.dot.live{background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:ping 1.6s infinite}
.dot.soon{background:var(--gold);box-shadow:0 0 12px var(--glow)}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.strip b{display:block;font-weight:700}
.strip small{color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid a:last-child:nth-child(odd){grid-column:span 2}
.tile{position:relative;display:flex;flex-direction:column;gap:3px;min-height:150px;padding:16px 14px 14px;border-radius:26px;text-decoration:none;color:var(--text);overflow:hidden;border:1.5px solid transparent;background:linear-gradient(160deg,#121936,#0a0e24) padding-box,linear-gradient(140deg,var(--c1),rgba(255,255,255,.06) 42%,var(--c2)) border-box;box-shadow:0 18px 34px -18px #000,0 0 30px -12px var(--c2);transition:transform .15s,box-shadow .2s;opacity:0;animation:rise .55s ease-out forwards;animation-delay:var(--i)}
.tile::before{content:"";position:absolute;width:150px;height:150px;left:-50px;top:-60px;border-radius:50%;background:radial-gradient(circle,var(--c2),transparent 65%);opacity:.28;pointer-events:none}
.tile::after{content:"";position:absolute;top:0;left:-90%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-20deg);animation:sweep 5.5s ease-in-out infinite;animation-delay:var(--d);pointer-events:none}
@keyframes sweep{0%,55%{left:-90%}100%{left:150%}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.tile:active{transform:scale(.95);box-shadow:0 10px 22px -14px #000,0 0 44px -4px var(--c2)}
.ic{position:relative;z-index:1;width:60px;height:60px;border-radius:19px;display:grid;place-items:center;margin-bottom:10px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 10px 22px -6px var(--c2),0 0 22px -2px var(--c2),inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -8px 14px rgba(0,0,0,.2);animation:glowp 3.2s ease-in-out infinite;animation-delay:var(--d)}
.ic::after{content:"";position:absolute;left:3px;right:3px;top:3px;height:46%;border-radius:16px 16px 42px 42px;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
@keyframes glowp{0%,100%{box-shadow:0 10px 22px -6px var(--c2),0 0 14px -2px var(--c2),inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -8px 14px rgba(0,0,0,.2)}50%{box-shadow:0 10px 26px -4px var(--c2),0 0 32px 2px var(--c2),inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -8px 14px rgba(0,0,0,.2)}}
.ic svg{position:relative;z-index:1;width:29px;height:29px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.4))}
.tile b{position:relative;z-index:1;font-size:17px;font-weight:800}
.tile small{position:relative;z-index:1;color:var(--muted);font-size:12.5px;font-weight:500;padding-right:30px}
.go{position:absolute;z-index:1;right:12px;bottom:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.go svg{width:14px;height:14px;fill:none;stroke:var(--text);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bdg{position:absolute;z-index:2;top:12px;right:12px;min-width:26px;height:26px;padding:0 8px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,#fb7185,#dc2626);box-shadow:0 0 14px rgba(239,68,68,.85);animation:bp 1.8s ease-in-out infinite}
@keyframes bp{50%{transform:scale(1.14)}}
.bdg.g{background:linear-gradient(135deg,#4ade80,#16a34a);box-shadow:0 0 14px rgba(34,197,94,.85)}
[hidden]{display:none!important}
.cr{text-align:center;margin-top:26px;font-size:12px;font-weight:700;color:var(--gold);opacity:.9;letter-spacing:.04em;text-shadow:0 0 10px var(--glow)}
#msg{margin-bottom:12px;padding:11px 14px;border-radius:12px;font-weight:600;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.tile{opacity:1}}
</style></head><body hidden>
<div class="mesh"></div>
<header><div class="brand"><img src="logo.png" alt=""><div><b>TNGPTC</b><small>Exam Portal</small></div></div><button id="out" type="button">Logout</button></header>
<main>
<div id="msg" hidden></div>
<div class="hero"><div class="ava"><div id="av">?</div></div><div class="hi"><small id="greet">Welcome</small><h1 id="nm">&nbsp;</h1><span class="role" id="role"></span></div></div>
<div class="strip"><span class="dot" id="dot"></span><div><b id="s1">Loading...</b><small id="s2"></small></div></div>
<div class="grid" id="grid"></div>
<div class="cr">&#10024; Created by Prem J &middot; D2 &#10024;</div>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var sb=TNG.client(),role="",uid=null;
var PH=/^data:image\/(jpeg|webp|png);base64,[A-Za-z0-9+\/=]+$/;
var SV={
 exams:'<path d="M9 3h6l1 2h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3z"/><path d="M8.5 13l2.3 2.3 4.7-4.8"/>',
 results:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.2-4.4A8 8 0 1 1 21 12z"/><path d="M8.5 11.5h7M8.5 14.5h4"/>',
 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
 monitor:'<path d="M2 12h4l3-8 5 16 3-8h5"/>',
 reexam:'<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/>',
 teachers:'<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="8" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.9M16 3.2a4 4 0 0 1 0 7.6"/>',
 students:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5"/><path d="M22 9v6"/>',
 classes:'<path d="M3 21h18M5 21V10l7-6 7 6v11"/><path d="M9.5 21v-6h5v6M12 10h.01"/>'
};
var G="#fcd34d|#f59e0b",C="#22d3ee|#0284c7",V="#a78bfa|#7c3aed",P="#f472b6|#db2777",L="#4ade80|#16a34a",O="#fb923c|#ea580c",B="#60a5fa|#2563eb";
var TILES={
 student:[["exams","Exams","Start and view exams","student.html",G],["results","Results","Marks and leaderboard","student.html#results",C],["chat","Chat","Friends and teachers","chat.html",V],["profile","Profile","Photo and about me","profile.html",P]],
 teacher:[["exams","Exams","Create and manage","teacher.html",G],["results","Results","Marks and download","results.html",C],["monitor","Monitor","Live exam status","monitor.html",L],["reexam","Re-exam","Absent students","teacher.html#reexam",O],["chat","Chat","Students and admin","chat.html",V],["profile","Profile","Photo and about me","profile.html",P]],
 admin:[["teachers","Teachers","Create and manage","admin.html#teacher",G],["students","Students","Accounts and reset","admin.html#student",B],["classes","Classes","Sections","admin.html#class",O],["results","Results","Marks and search","results.html",C],["monitor","Monitor","Live exam status","monitor.html",L],["chat","Chat","All chats","chat.html",V],["profile","Profile","Photo and about me","profile.html",P]]
};
function el(t,x,c){var e=document.createElement(t);if(x!=null)e.textContent=x;if(c)e.className=c;return e}
function svg(inner){var d=document.createElement("span");d.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+inner+'</svg>';return d.firstChild}
function cap(s){s=String(s||"");return s.charAt(0).toUpperCase()+s.slice(1)}
function when(x){try{return new Date(x).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
function build(){
 var g=$("grid");g.textContent="";
 TILES[role].forEach(function(t,i){
  var a=el("a",null,"tile");a.href=t[3];a.id="card-"+t[0];
  var cs=t[4].split("|");a.style.cssText="--c1:"+cs[0]+";--c2:"+cs[1]+";--i:"+(i*70)+"ms;--d:"+(i*0.7)+"s";
  var ic=el("div",null,"ic");ic.appendChild(svg(SV[t[0]]));a.appendChild(ic);
  a.appendChild(el("b",t[1]));a.appendChild(el("small",t[2]));
  var go=el("span",null,"go");go.appendChild(svg('<path d="M9 6l6 6-6 6"/>'));a.appendChild(go);
  var b=el("span","","bdg");b.id="badge-"+t[0];b.hidden=true;a.appendChild(b);g.appendChild(a)});
}
function badge(id,n,green){var b=$("badge-"+id);if(!b)return;if(n>0){b.textContent=n>99?"99+":n;b.className="bdg"+(green?" g":"");b.hidden=false}else b.hidden=true}
function strip(dot,a,b){$("dot").className="dot "+dot;$("s1").textContent=a;$("s2").textContent=b||""}
async function refresh(){
 try{
  var u=await sb.rpc("chat_unread");if(!u.error)badge("chat",Number(u.data)||0);
  var now=Date.now();
  if(role==="student"){
   var r=await sb.rpc("my_exams");if(r.error)return;
   var L=(r.data||[]).filter(function(x){return Number(x.seconds_to_end)>0&&(!x.status||x.status==="in_progress")});
   badge("exams",L.length,true);
   var live=L.filter(function(x){return Number(x.seconds_to_start)<=0});
   var nxt=L.filter(function(x){return Number(x.seconds_to_start)>0}).sort(function(a,b){return a.seconds_to_start-b.seconds_to_start})[0];
   if(live.length)strip("live","Exam live now: "+live[0].name,live[0].subject||"");
   else if(nxt)strip("soon","Next exam: "+nxt.name,(nxt.subject?nxt.subject+" | ":"")+when(nxt.start));
   else strip("","No upcoming exams","Check Results for your marks");
  }else{
   var e=await sb.from("exams").select("name,subject,start_time,duration_min").eq("status","published");
   if(e.error)return;
   var live2=[],up=[];
   (e.data||[]).forEach(function(x){var st=new Date(x.start_time).getTime(),en=st+x.duration_min*60000;
    if(now>=st&&now<en)live2.push(x);else if(st>now)up.push(x)});
   up.sort(function(a,b){return new Date(a.start_time)-new Date(b.start_time)});
   badge("monitor",live2.length,true);
   if(live2.length)strip("live","Live exams: "+live2.length,live2[0].name+(live2[0].subject?" | "+live2[0].subject:""));
   else if(up.length)strip("soon","Next exam: "+up[0].name,(up[0].subject?up[0].subject+" | ":"")+when(up[0].start_time));
   else strip("","No live or upcoming exams","");
  }
 }catch(x){}
}
function ping(){try{sb.rpc("presence_ping")}catch(e){}}
window.addEventListener("pageshow",function(){if(role){refresh();ping()}});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&role){refresh();ping()}});
$("out").onclick=async function(){try{await sb.auth.signOut()}catch(e){}location.href="index.html"};
(async function(){
 var s=(await sb.auth.getSession()).data.session;
 if(!s){location.replace("index.html");return}
 uid=s.user.id;
 var pr=await sb.from("profiles").select("role,full_name").eq("id",uid).single(),p=pr.data;
 if(!p&&TNG.netErr(pr.error)){TNG.fail();return}
 if(!p||!TILES[p.role]){try{await sb.auth.signOut()}catch(e){}location.replace("index.html");return}
 role=p.role;var name=p.full_name||cap(role);
 var h=new Date().getHours();$("greet").textContent=h<12?"Good morning":h<17?"Good afternoon":"Good evening";
 $("nm").textContent=name;$("role").textContent=role;$("av").textContent=(name.trim().charAt(0)||"?").toUpperCase();
 build();document.body.hidden=false;strip("","Loading...","");
 refresh();ping();setInterval(function(){if(!document.hidden)refresh()},10000);setInterval(function(){if(!document.hidden)ping()},60000);
 try{var q=await sb.rpc("profile_get");var ph=q.data&&q.data.photo;
  if(ph&&PH.test(ph)){var im=document.createElement("img");im.alt="";im.src=ph;$("av").textContent="";$("av").appendChild(im)}}catch(e){}
})();
})();
</script></body></html>
