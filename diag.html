<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connection test</title>
<style>
body{margin:0;padding:16px;background:#0b0b0f;color:#f5f1e8;font:15px/1.5 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}small{color:#a8a29e}
button{margin:12px 0;padding:12px 18px;border:0;border-radius:10px;background:#fbbf24;color:#1a1206;font:inherit;font-weight:700}
.r{padding:10px 0;border-top:1px solid #2a2a33}.ok{color:#4ade80}.bad{color:#f87171}.slow{color:#fbbf24}
pre{white-space:pre-wrap;margin:0;font:13px/1.5 ui-monospace,monospace}
</style></head><body>
<h1>Connection test</h1><small>Runs 5 checks (each twice). Takes about 30 seconds. Then send a screenshot.</small><br>
<button id="go" type="button">Start test</button>
<div id="out"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
(function(){
var out=document.getElementById("out"),U=TNG.URL,K=TNG.KEY;
function line(t,cls){var d=document.createElement("div");d.className="r "+(cls||"");var p=document.createElement("pre");p.textContent=t;d.appendChild(p);out.appendChild(d)}
function cls(ms){return ms<1500?"ok":ms<5000?"slow":"bad"}
async function timed(name,fn){
 for(var i=1;i<=2;i++){
  var t=performance.now(),res;
  try{res=await Promise.race([fn(),new Promise(function(_,r){setTimeout(function(){r(new Error("no answer in 20s"))},20000)})])}catch(e){res="ERROR: "+(e&&e.message||e)}
  var ms=Math.round(performance.now()-t);
  line(name+" #"+i+": "+ms+" ms  ->  "+res,/ERROR/.test(res)?"bad":cls(ms));
 }
}
var H={apikey:K,"Content-Type":"application/json"};
document.getElementById("go").onclick=async function(){
 this.disabled=true;out.textContent="";
 var c=navigator.connection||{};
 line("Network: "+(c.effectiveType||"?")+" | rtt "+(c.rtt!=null?c.rtt+"ms":"?")+" | downlink "+(c.downlink!=null?c.downlink+"Mbps":"?")+" | online "+navigator.onLine+" | locks "+(!!navigator.locks));
 await timed("1 Auth health (plain GET)",async function(){var r=await fetch(U+"/auth/v1/health",{headers:{apikey:K},cache:"no-store"});return "HTTP "+r.status});
 await timed("2 Database call (reg_options)",async function(){var r=await fetch(U+"/rest/v1/rpc/reg_options",{method:"POST",headers:H,body:"{}",cache:"no-store"});var j=await r.json().catch(function(){return null});return "HTTP "+r.status+(j&&j.departments?" | departments: "+j.departments.length:"")});
 await timed("3 Login with WRONG password (plain fetch)",async function(){var r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:H,body:JSON.stringify({email:"diagtest@tngptc.app",password:"wrong-password-1"}),cache:"no-store"});return "HTTP "+r.status+" (400 is normal)"});
 await timed("4 Login with WRONG password (app library)",async function(){var sb=TNG.client();var r=await sb.auth.signInWithPassword({email:"diagtest@tngptc.app",password:"wrong-password-2"});return r.error?"error: "+r.error.message+" (normal)":"unexpected success"});
 await timed("5 Stored session check (app library)",async function(){var sb=TNG.client();var r=await sb.auth.getSession();return r.data&&r.data.session?"session found":"no session"});
 line("Done. Send a screenshot of this page.","ok");this.disabled=false;
};
})();
</script></body></html>
